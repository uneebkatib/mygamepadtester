# =============================================================================
# aaPanel / Nginx configuration for MyGamepadTester static export (out/)
# =============================================================================
#
# 1. In aaPanel → Website → set the site root to: /path/to/repo/out
#    (the directory created by `npm run build`)
#
# 2. Open Website → Configuration File and REPLACE the entire default server {}
#    template with the block below (keep your SSL/listen directives).
#
# ─── FULL server {} template (copy-paste, adjust paths/domain) ───────────────
#
#   server {
#       listen 80;
#       listen [::]:80;
#       server_name mygamepadtester.com www.mygamepadtester.com;
#
#       # ── Redirect HTTP → HTTPS ────────────────────────────────────────────
#       return 301 https://$host$request_uri;
#   }
#
#   server {
#       listen 443 ssl http2;
#       listen [::]:443 ssl http2;
#       server_name mygamepadtester.com www.mygamepadtester.com;
#
#       root /path/to/repo/out;    # ← change to your actual out/ path
#       index index.html;
#
#       # SSL (aaPanel fills these in):
#       # ssl_certificate     /path/to/cert.pem;
#       # ssl_certificate_key /path/to/key.pem;
#
#       # ── gzip ─────────────────────────────────────────────────────────────
#       gzip on;
#       gzip_vary on;
#       gzip_proxied any;
#       gzip_comp_level 6;
#       gzip_types text/plain text/css text/javascript application/javascript
#                  application/json image/svg+xml font/woff2;
#
#       # ── Security headers ─────────────────────────────────────────────────
#       add_header X-Frame-Options "SAMEORIGIN" always;
#       add_header X-Content-Type-Options "nosniff" always;
#       add_header Referrer-Policy "strict-origin-when-cross-origin" always;
#       add_header X-XSS-Protection "1; mode=block" always;
#       add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
#
#       # ── Next.js immutable static assets ──────────────────────────────────
#       # These files include a content hash in their name so they are safe to
#       # cache for 1 year.  Caching them prevents 228 KiB of re-downloads on
#       # every revisit (Lighthouse: "Use efficient cache lifetimes").
#       location ^~ /_next/static/ {
#           add_header Cache-Control "public, max-age=31536000, immutable";
#           try_files $uri =404;
#       }
#
#       # ── Font files (content-hashed by Next.js) ────────────────────────────
#       location ~* \.(woff2?|ttf|otf|eot)$ {
#           add_header Cache-Control "public, max-age=31536000, immutable";
#           try_files $uri =404;
#       }
#
#       # ── WebP / PNG / JPG / SVG images ───────────────────────────────────
#       location ~* \.(webp|png|jpe?g|svg|gif|ico)$ {
#           add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
#           try_files $uri =404;
#       }
#
#       # ── Service worker — always revalidate ───────────────────────────────
#       location = /sw.js {
#           add_header Cache-Control "no-cache, no-store, must-revalidate";
#           try_files $uri =404;
#       }
#
#       # ── PHP (api.php for telemetry / global-stats) ───────────────────────
#       location ~ \.php$ {
#           fastcgi_pass unix:/tmp/php83.sock;   # adjust PHP version as needed
#           fastcgi_index index.php;
#           include fastcgi_params;
#           fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
#       }
#
#       # ── 301 Permanent Redirects ──────────────────────────────────────────
#       # (paste the rewrite rules from the bottom of this file here)
#
#       # ── HTML pages — always revalidate ──────────────────────────────────
#       location / {
#           add_header Cache-Control "public, max-age=0, must-revalidate";
#           # trailingSlash:true generates stick-drift-test/index.html so $uri/
#           # finds the directory without any non-standard $uri.html trick.
#           try_files $uri $uri/ $uri.html /index.html;
#       }
#   }
#
# =============================================================================

# Old Controller Tester pages redirect to Main Page
rewrite ^/ps5-controller-tester/?$ / permanent;
rewrite ^/ps4-controller-tester/?$ / permanent;
rewrite ^/xbox-controller-tester/?$ / permanent;
rewrite ^/switch-pro-tester/?$ / permanent;
rewrite ^/xbox-elite-tester/?$ / permanent;
rewrite ^/8bitdo-tester/?$ / permanent;
rewrite ^/scuf-controller-tester/?$ / permanent;
rewrite ^/razer-controller-tester/?$ / permanent;
rewrite ^/controller-input-tester/?$ / permanent;

# Old Tools URLs redirect to the new ones or home
rewrite ^/latency-test/?$ / permanent;
rewrite ^/tools/latency-test/?$ / permanent;
rewrite ^/trigger-test/?$ / permanent;
rewrite ^/tools/trigger-test/?$ / permanent;
rewrite ^/trigger-pressure-test/?$ / permanent;
rewrite ^/vibration-tester/?$ /vibration-test/ permanent;

# Old stick drift tester redirects to the guide
rewrite ^/stick-drift-tester/?$ /guides/stick-drift/ permanent;

# Articles and other old URLs
rewrite ^/latest-articles/?$ / permanent;
rewrite ^/articles/(.*)$ /guides/$1 permanent;
rewrite ^/blog/(.*)$ /guides/$1 permanent;
rewrite ^/optimization/(.*)$ /guides/$1 permanent;
